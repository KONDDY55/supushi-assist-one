<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui,sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; color: #183042; }
    button { background: #125b62; color: white; border: 0; border-radius: 6px; padding: 12px 20px; cursor: pointer; }
    button:disabled { opacity: .6; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    td, th { text-align: left; border-bottom: 1px solid #ddd; padding: 10px; overflow-wrap: anywhere; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>スプシアシストOne</h1>
  <p>要件定義自動化プロトタイプ · 入力資料の確認</p>
  <p>フォルダ直下の資料を表示します。要件定義の生成機能は準備中です。</p>
  <button id="load" onclick="loadFiles()">Driveの資料を確認</button>
  <p id="status" role="status" aria-live="polite"></p>
  <table><thead><tr><th>資料名</th><th>種類</th><th>更新日時</th></tr></thead><tbody id="files"></tbody></table>
  <script>
    function loadFiles() {
      const button = document.getElementById('load');
      button.disabled = true;
      document.getElementById('files').replaceChildren();
      document.getElementById('status').textContent = '資料一覧を取得中…';
      google.script.run.withSuccessHandler(function(result) {
        button.disabled = false;
        if (result.status !== 'success') {
          document.getElementById('status').textContent = result.message;
          return;
        }
        document.getElementById('status').textContent = result.folderName + '：資料 ' + result.files.length + '件、フォルダ ' + result.folders.length + '件' + (result.truncated ? '（上限に達しました。一部の項目は未表示です）' : '');
        result.folders.concat(result.files).forEach(function(file) {
          const row = document.createElement('tr');
          const name = document.createElement('td');
          const link = document.createElement('a');
          link.textContent = file.name;
          if (/^https:\/\/(drive|docs)\.google\.com\//.test(file.url)) link.href = file.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          name.appendChild(link);
          row.appendChild(name);
          [file.mimeType, new Date(file.updatedAt).toLocaleString('ja-JP', {timeZone: 'Asia/Tokyo'})].forEach(function(value) {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.appendChild(cell);
          });
          document.getElementById('files').appendChild(row);
        });
      }).withFailureHandler(function() {
        button.disabled = false;
        document.getElementById('status').textContent = 'GASとの通信に失敗しました。再度お試しください。';
      }).listSourceFiles();
    }
  </script>
</body>
</html>
